<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plasticine Parlor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,900;1,9..144,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1e9da; --card:#fbf7ec; --line:#ddd0b8; --ink:#322920; --dim:#94866c; --faint:#bcae90;
  --clay1:#c85a3f; --clay2:#4a72b0; --clay3:#d9a83c; --clay4:#5e9e5a; --clay5:#8e5aa8; --accent:#b0512f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Karla',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 18px 48px}
header{text-align:center}
h1{font-family:'Fraunces',serif;font-weight:900;font-size:36px;letter-spacing:-.5px}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.sub{color:var(--dim);font-size:12px;letter-spacing:2px;margin-top:8px;text-transform:uppercase;font-weight:700}
#wrap{margin:22px 0 14px;border-radius:18px;background:var(--card);padding:14px;box-shadow:0 2px 0 rgba(50,41,32,.08),0 18px 40px -18px rgba(50,41,32,.25);border:1px solid var(--line)}
#table{border-radius:10px;overflow:hidden;position:relative}
canvas{display:block;cursor:grab;width:min(720px,90vw);height:auto;touch-action:none}
canvas:active{cursor:grabbing}
#tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:0 1px 0 rgba(50,41,32,.06)}
button{cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:11px;font-weight:700;padding:10px 15px;letter-spacing:1.4px;text-transform:uppercase;transition:border-color .15s,color .15s}
button:hover{border-color:var(--accent);color:var(--accent)}
.sw{width:30px;height:30px;border-radius:46% 54% 52% 48%/48% 46% 54% 52%;padding:0;border:2px solid transparent;box-shadow:inset -3px -4px 0 rgba(0,0,0,.14),inset 3px 4px 0 rgba(255,255,255,.28);transition:transform .15s}
.sw:hover{transform:scale(1.12)}
.sw.sel{border-color:var(--ink);transform:scale(1.12)}
.sep{width:1px;height:24px;background:var(--line)}
#hud{font-size:11.5px;color:var(--dim);letter-spacing:1.6px;margin-top:14px;text-transform:uppercase;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Plasticine <em>Parlor</em></h1>
  <div class="sub">Drag blobs onto the canvas &middot; smear them together</div>
</header>
<div id="wrap"><div id="table"><canvas id="cv" width="720" height="480"></canvas></div></div>
<div id="tools">
  <button class="sw sel" data-c="#c85a3f" style="background:#c85a3f" aria-label="terracotta"></button>
  <button class="sw" data-c="#4a72b0" style="background:#4a72b0" aria-label="blue"></button>
  <button class="sw" data-c="#d9a83c" style="background:#d9a83c" aria-label="mustard"></button>
  <button class="sw" data-c="#5e9e5a" style="background:#5e9e5a" aria-label="green"></button>
  <button class="sw" data-c="#8e5aa8" style="background:#8e5aa8" aria-label="plum"></button>
  <span class="sep"></span>
  <button id="add">Add blob</button>
  <button id="squish">Squish all</button>
  <button id="clear">Clear</button>
</div>
<div id="hud">drag to smear &middot; blobs blend where they overlap</div>
<script>
function $(id){return document.getElementById(id);}
const cv=$('cv'),ctx=cv.getContext('2d');
let blobs=[],color='#c85a3f',drag=null;
function draw(){
  const g=ctx.createRadialGradient(360,230,80,360,240,520);
  g.addColorStop(0,'#faf5e9');g.addColorStop(1,'#ece2cd');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  blobs.forEach(b=>{
    ctx.save();
    ctx.shadowColor='rgba(50,41,32,.28)';ctx.shadowBlur=10;ctx.shadowOffsetY=5;
    ctx.beginPath();
    ctx.ellipse(b.x,b.y,b.rx,b.ry,b.rot,0,Math.PI*2);
    ctx.fillStyle=b.c;ctx.globalAlpha=.94;ctx.fill();
    ctx.restore();
    ctx.globalAlpha=.3;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(b.x-b.rx*.32,b.y-b.ry*.38,b.rx*.24,b.ry*.16,b.rot-.3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
}
function hit(x,y){for(let i=blobs.length-1;i>=0;i--){const b=blobs[i];if(((x-b.x)**2)/(b.rx**2)+((y-b.y)**2)/(b.ry**2)<=1)return b;}return null;}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*(cv.width/r.width),(e.clientY-r.top)*(cv.height/r.height)];}
function add(c){
  blobs.push({x:80+Math.random()*560,y:80+Math.random()*320,rx:30+Math.random()*35,ry:24+Math.random()*28,rot:Math.random()*3,c:c||color});
  draw();
}
cv.addEventListener('pointerdown',e=>{
  const[x,y]=pos(e);drag=hit(x,y)||null;
  if(drag){blobs=blobs.filter(b=>b!==drag);blobs.push(drag);drag.ox=x-drag.x;drag.oy=y-drag.y;}
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const[x,y]=pos(e);
  drag.x=x-drag.ox;drag.y=y-drag.oy;
  drag.rot+=.02;
  blobs.forEach(b=>{
    if(b===drag)return;
    if(Math.hypot(b.x-drag.x,b.y-drag.y)<(b.rx+drag.rx)*.6){
      b.rx+=.3;b.ry+=.2;drag.rx=Math.max(15,drag.rx-.15);
    }
  });
  draw();
});
window.addEventListener('pointerup',()=>drag=null);
$('add').onclick=()=>add();
$('squish').onclick=()=>{
  if(blobs.length<2)return;
  const cx=blobs.reduce((a,b)=>a+b.x,0)/blobs.length,cy=blobs.reduce((a,b)=>a+b.y,0)/blobs.length;
  blobs.forEach(b=>{b.x+=(cx-b.x)*.35;b.y+=(cy-b.y)*.35;b.rx*=1.1;b.ry*=1.1;});
  draw();
};
$('clear').onclick=()=>{blobs=[];draw();};
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');});
add('#c85a3f');add('#4a72b0');add('#d9a83c');
</script>
</body>
</html>
