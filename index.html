<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plasticine Parlor</title>
<style>
:root{--bg:#14100e;--card:#1d1713;--line:#33271e;--ink:#f0e8dc;--dim:#a89884;--accent:#e89a5e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 18px}
h1{font-size:24px;letter-spacing:7px;color:var(--accent);text-shadow:0 0 22px rgba(232,154,94,.25)}
.sub{color:var(--dim);font-size:11px;letter-spacing:2.5px;margin-top:6px;text-transform:uppercase}
#wrap{margin:16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(circle,#f7f2ea,#e8dfd0);position:relative}
canvas{display:block;cursor:grab}
canvas:active{cursor:grabbing}
#tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:inherit;font-size:12px;padding:10px 14px;letter-spacing:1px;transition:.15s}
button:hover{border-color:var(--accent)}
.sw{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid transparent}
.sw.sel{border-color:#fff}
#hud{font-size:11.5px;color:var(--dim);letter-spacing:1.5px;margin-top:10px}
</style>
</head>
<body>
<h1>PLASTICINE PARLOR</h1>
<div class="sub">drag blobs onto the canvas &middot; smear them together</div>
<div id="wrap"><canvas id="cv" width="720" height="480"></canvas></div>
<div id="tools">
  <button class="sw sel" data-c="#d4553a" style="background:#d4553a"></button>
  <button class="sw" data-c="#3a76d4" style="background:#3a76d4"></button>
  <button class="sw" data-c="#e8c53a" style="background:#e8c53a"></button>
  <button class="sw" data-c="#3ad47c" style="background:#3ad47c"></button>
  <button class="sw" data-c="#9a3ad4" style="background:#9a3ad4"></button>
  <button id="add">ADD BLOB</button>
  <button id="squish">SQUISH ALL</button>
  <button id="clear">CLEAR</button>
</div>
<div id="hud">drag to smear &middot; blobs blend where they overlap</div>
<script>
const cv=$('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
let blobs=[],color='#d4553a',drag=null;
function draw(){
  const g=ctx.createRadialGradient(360,240,80,360,240,480);
  g.addColorStop(0,'#f7f2ea');g.addColorStop(1,'#e8dfd0');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  blobs.forEach(b=>{
    ctx.beginPath();
    ctx.ellipse(b.x,b.y,b.rx,b.ry,b.rot,0,Math.PI*2);
    ctx.fillStyle=b.c;ctx.globalAlpha=.92;ctx.fill();
    ctx.globalAlpha=.25;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(b.x-b.rx*.3,b.y-b.ry*.35,b.rx*.25,b.ry*.18,b.rot,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
}
function hit(x,y){return blobs.find(b=>((x-b.x)**2)/(b.rx**2)+((y-b.y)**2)/(b.ry**2)<=1);}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*(cv.width/r.width),(e.clientY-r.top)*(cv.height/r.height)];}
function add(c){
  blobs.push({x:80+Math.random()*560,y:80+Math.random()*320,rx:30+Math.random()*35,ry:24+Math.random()*28,rot:Math.random()*3,c:c||color});
  draw();
}
cv.addEventListener('pointerdown',e=>{
  const[x,y]=pos(e);drag=hit(x,y)||null;
  if(drag){drag.ox=x-drag.x;drag.oy=y-drag.y;}
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const[x,y]=pos(e);
  drag.x=x-drag.ox;drag.y=y-drag.oy;
  drag.rot+=.02;
  /* blend on overlap */
  blobs.forEach(b=>{
    if(b===drag)return;
    if(Math.hypot(b.x-drag.x,b.y-drag.y)<(b.rx+drag.rx)*.6){
      b.rx+=.3;b.ry+=.2;drag.rx=Math.max(15,drag.rx-.15);
    }
  });
  draw();
});
window.addEventListener('pointerup',()=>drag=null);
$('add').onclick=()=>add();
$('squish').onclick=()=>{
  if(blobs.length<2)return;
  const cx=blobs.reduce((a,b)=>a+b.x,0)/blobs.length,cy=blobs.reduce((a,b)=>a+b.y,0)/blobs.length;
  blobs.forEach(b=>{b.x+=(cx-b.x)*.35;b.y+=(cy-b.y)*.35;b.rx*=1.1;b.ry*=1.1;});
  draw();
};
$('clear').onclick=()=>{blobs=[];draw();};
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');});
add('#d4553a');add('#3a76d4');add('#e8c53a');
</script>
</body>
</html>
